name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race detector
        run: CGO_ENABLED=1 go test -race ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all packages
        run: go build ./...

  sqlc:
    name: sqlc determinism
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Verify generated database code
        run: |
          sqlc generate

          if [ -n "$(git status --porcelain -- internal/database/generated)" ]; then
            git status --short -- internal/database/generated
            git diff -- internal/database/generated
            exit 1
          fi

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_DB: shortscale_ci
          POSTGRES_USER: shortscale
          POSTGRES_PASSWORD: shortscale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortscale -d shortscale_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.28.0

      - name: Validate migration round trip
        env:
          DATABASE_URL: postgres://shortscale:shortscale@localhost:5432/shortscale_ci?sslmode=disable
        run: |
          goose -dir migrations postgres "$DATABASE_URL" up
          goose -dir migrations postgres "$DATABASE_URL" status
          goose -dir migrations postgres "$DATABASE_URL" down-to 0
          goose -dir migrations postgres "$DATABASE_URL" up
          goose -dir migrations postgres "$DATABASE_URL" status

  product-integration:
    name: Product integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_DB: shortscale_product_ci
          POSTGRES_USER: shortscale
          POSTGRES_PASSWORD: shortscale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortscale -d shortscale_product_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.28.0

      - name: Apply database migrations
        env:
          DATABASE_URL: postgres://shortscale:shortscale@localhost:5432/shortscale_product_ci?sslmode=disable
        run: goose -dir migrations postgres "$DATABASE_URL" up

      - name: Run backend product integration flow
        env:
          SHORTSCALE_TEST_DATABASE_URL: postgres://shortscale:shortscale@localhost:5432/shortscale_product_ci?sslmode=disable
        run: |
          go test ./cmd/api             -run '^TestBackendProductFlow$'             -count=1             -v

      - name: Run backend product integration race check
        env:
          SHORTSCALE_TEST_DATABASE_URL: postgres://shortscale:shortscale@localhost:5432/shortscale_product_ci?sslmode=disable
        run: |
          CGO_ENABLED=1 go test -race ./cmd/api             -run '^TestBackendProductFlow$'             -count=1

  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config >/dev/null

      - name: Verify application runtime hardening
        run: |
          docker compose config --format json > /tmp/compose.json

          python3 - <<'PY'
          import json

          with open("/tmp/compose.json") as f:
              config = json.load(f)

          services = config["services"]

          for name in ("api", "analytics-consumer"):
              service = services[name]

              assert service.get("user") == "65532:65532", (
                  f"{name}: expected non-root user 65532:65532"
              )

              assert service.get("read_only") is True, (
                  f"{name}: root filesystem must be read-only"
              )

              cap_drop = service.get("cap_drop", [])
              assert "ALL" in cap_drop, (
                  f"{name}: all Linux capabilities must be dropped"
              )

              security_opt = service.get("security_opt", [])
              assert any(
                  option.startswith("no-new-privileges")
                  for option in security_opt
              ), f"{name}: no-new-privileges must be enabled"

          print("application runtime hardening: PASS")
          PY

      - name: Build API image
        run: docker build -f Dockerfile -t shortscale-api:ci .

      - name: Build analytics consumer image
        run: docker build -f Dockerfile.analytics-consumer -t shortscale-analytics-consumer:ci .

      - name: Verify production image metadata
        run: |
          API_USER="$(docker image inspect shortscale-api:ci --format '{{.Config.User}}')"
          API_ENTRYPOINT="$(docker image inspect shortscale-api:ci --format '{{json .Config.Entrypoint}}')"

          CONSUMER_USER="$(docker image inspect shortscale-analytics-consumer:ci --format '{{.Config.User}}')"
          CONSUMER_ENTRYPOINT="$(docker image inspect shortscale-analytics-consumer:ci --format '{{json .Config.Entrypoint}}')"

          test "$API_USER" = "65532:65532"
          test "$API_ENTRYPOINT" = '["/shortscale-api"]'

          test "$CONSUMER_USER" = "65532:65532"
          test "$CONSUMER_ENTRYPOINT" = '["/shortscale-analytics-consumer"]'

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./...

      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build API image for scanning
        run: docker build -f Dockerfile -t shortscale-api:security .

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: shortscale-api:security
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build analytics consumer image for scanning
        run: docker build -f Dockerfile.analytics-consumer -t shortscale-analytics-consumer:security .

      - name: Scan analytics consumer image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: shortscale-analytics-consumer:security
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev
