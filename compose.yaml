services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortscale
      POSTGRES_USER: shortscale
      POSTGRES_PASSWORD: shortscale
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortscale -d shortscale"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
