services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortscale
      POSTGRES_USER: shortscale
      POSTGRES_PASSWORD: shortscale
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortscale -d shortscale"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:8.0-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://shortscale:shortscale@postgres:5432/shortscale?sslmode=disable"
      REDIS_ADDR: "redis:6379"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
